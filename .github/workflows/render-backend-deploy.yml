name: Render Backend Deployment

on:
  push:
    branches: [ main ]
    paths:
      - backend/**
      - render.yaml
      - .github/workflows/render-backend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: render-backend
    steps:
      - name: Check secrets availability
        id: check_secrets
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ] && [ -n "${{ secrets.RENDER_SERVICE_URL }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "RENDER_DEPLOY_HOOK_URL or RENDER_SERVICE_URL not configured yet in GitHub secrets. Skipping hook trigger."
          fi

      - name: Create GitHub deployment
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'render-backend',
              description: 'Deploy FastAPI backend to Render',
              auto_merge: false,
              required_contexts: [],
              production_environment: true
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Mark deployment in progress
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'in_progress',
              environment: 'render-backend',
              environment_url: '${{ secrets.RENDER_SERVICE_URL }}',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Render backend deployment started'
            });

      - name: Trigger Render deploy
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for backend health
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "${{ secrets.RENDER_SERVICE_URL }}/api/v1/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Mark deployment success
        if: steps.check_secrets.outputs.has_secrets == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment_id }}',
              state: 'success',
              environment: 'render-backend',
              environment_url: '${{ secrets.RENDER_SERVICE_URL }}',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Render backend is healthy'
            });
